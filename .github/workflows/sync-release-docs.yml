name: Sync release docs

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - 'release_notes/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Regenerate README, CHANGELOG, and release notes
        run: |
          chmod +x scripts/sync-release-docs.sh scripts/generate-release-notes.sh
          bash scripts/sync-release-docs.sh

      - name: Commit and push doc updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md release_notes/
          if git diff --staged --quiet; then
            echo "Release docs already up to date."
            exit 0
          fi
          git commit -m "chore: sync release docs [skip ci]"
          # Two pushes minutes apart - a release branch and then main - start two of these runs,
          # and the loser's plain `git push` is rejected as a non-fast-forward. That failed the
          # job and left CHANGELOG.md unsynced for a documentation-only reason, so the push is
          # retried after rebasing. Bounded, so a real conflict still fails the job.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the remote and retrying."
            git pull --rebase --autostash
            sleep 5
          done
          echo "Could not push the regenerated docs after 3 attempts." >&2
          exit 1
