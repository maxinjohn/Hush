## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4096M -XX:+UseParallelGC -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
org.gradle.configuration-cache=true
org.gradle.unsafe.configuration-cache=true
# A configuration-cache problem is a build that will die at execution time instead: Gradle stores the
# entry, restores it, and a task action that reached back into a build script then dies with
# "...because this$0 is null" (or "cannot serialize Gradle script object references"). That is how a
# broken :waze-shim:packageShimApks action got past `assembleGmsMobileUniversalRelease` locally and
# only surfaced in CI's release stage. Failing here reports it where it is introduced, and every
# task set the workflows use (mobile debug + lint, copyShimApks, gms/tv release, shim releases)
# stores an entry with zero problems.
org.gradle.configuration-cache.problems=fail
org.gradle.ide.support.future.agp.versions=true
android.nonTransitiveRClass=false

org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.parallel=true
org.gradle.workers.max=6
org.gradle.vfs.watch=true
org.gradle.caching=true

android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

ksp.incremental=true
kotlin.incremental=true
android.sourceset.disallowProvider=false
